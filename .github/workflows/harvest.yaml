name: Nightly Recipe Harvest

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-storage google-genai pydantic requests streamlit urllib3

      - name: Create Google Cloud Key File
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_TOML }}' > gcp-key.json

      - name: Run Harvester Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
        run: python harvest_to_gcs.py