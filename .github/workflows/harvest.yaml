name: Nightly Recipe Harvest

on:
  schedule:
    # Runs every night at 02:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-storage google-genai pydantic requests streamlit urllib3

      - name: Create Streamlit Secrets for Script
        run: |
          mkdir -p .streamlit
          echo "GEMINI_API_KEY = '${{ secrets.GEMINI_API_KEY }}'" > .streamlit/secrets.toml
          echo "GCS_BUCKET_NAME = '${{ secrets.GCS_BUCKET_NAME }}'" >> .streamlit/secrets.toml
          echo "[gcp_service_account]" >> .streamlit/secrets.toml
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_TOML }}' >> .streamlit/secrets.toml

      - name: Run Harvester Script
        run: python harvest_to_gcs.py
